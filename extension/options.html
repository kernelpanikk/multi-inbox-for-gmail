<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Multi Inbox for Gmail — Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <h1>Multi Inbox for Gmail</h1>
  <p class="hint">
    Click "Add account" and sign in with Google in the tab that opens: the account is added
    automatically. Passwords stay with Google; the extension never sees them.
  </p>

  <h2>Accounts</h2>
  <div id="list"></div>
  <button class="primary" type="button" id="add">Add account</button>

  <h2>Preferences</h2>
  <label class="field">
    Check for new mail every
    <select id="interval">
      <option value="1">1 minute</option>
      <option value="2">2 minutes</option>
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="30">30 minutes</option>
    </select>
  </label>
  <label class="field">
    <input type="checkbox" id="notify"> Show a notification when new email arrives
  </label>
  <p id="status"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
